services:
  postgres:
    image: postgres:16-alpine
    container_name: epic-telemetry-postgres
    environment:
      POSTGRES_DB: epic_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - epic_telemetry_pgdata:/var/lib/postgresql/data

volumes:
  epic_telemetry_pgdata:
