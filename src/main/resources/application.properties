spring.application.name=epic
server.port=8080

# PostgreSQL. La aplicación en ejecución no usa H2.
# Docker Compose de este repo crea epic_telemetry con postgres/postgres.
# Si ya tienes PostgreSQL en el puerto 5432, crea esa base y ajusta la contraseña.
spring.datasource.url=jdbc:postgresql://localhost:5432/epic_telemetry
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
